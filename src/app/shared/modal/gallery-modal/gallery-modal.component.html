<div class="gallery-modal-backdrop" *ngIf="open" (click)="onClose()">
  <div class="gallery-modal" (click)="$event.stopPropagation()">
    <button class="gallery-modal-close" (click)="onClose()" aria-label="Close">&times;</button>
    <div class="gallery-modal-content">
      <div class="gallery-modal-image">
        <img [src]="images[currentIndex]" alt="Gallery image" />
        <button class="gallery-modal-arrow left" (click)="prev()" [disabled]="currentIndex === 0"
          aria-label="Previous image">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="gallery-modal-arrow right" (click)="next()" [disabled]="currentIndex === images.length - 1"
          aria-label="Next image">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="gallery-modal-thumbnails">
        <img *ngFor="let img of images; let i = index" [src]="img" [class.active]="i === currentIndex"
          (click)="select(i)" alt="Thumbnail" />
      </div>
    </div>
  </div>
</div>
