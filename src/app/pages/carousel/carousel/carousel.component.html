<div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/carosuel-home/image1.jpg" class="d-block w-100" alt="Image 1" (click)="openFullscreen($event)">
    </div>
    <div class="carousel-item">
      <img src="/carosuel-home/image2.jpg" class="d-block w-100" alt="Image 2" (click)="openFullscreen($event)">
    </div>
    <div class="carousel-item">
      <img src="/carosuel-home/image3.jpg" class="d-block w-100" alt="Image 3" (click)="openFullscreen($event)">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
  <!-- Close Button -->
  <button id="closeFullscreen" class="btn btn-danger close-fullscreen" (click)="closeFullscreen()" hidden>
    Close
  </button>
</div>
