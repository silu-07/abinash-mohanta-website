<div class="container py-5">
  <h2 class="text-center mb-2">Client Reviews</h2>
  <div class="text-center mb-3" style="font-size: 1.15rem; font-weight: 500;">
    <span>We have a <span style="color: #ffc107; font-weight: bold;">5-star</span> rating on 
  <a href="https://www.google.com/search?q=abinash+mohanta+business+name&ludocid=1234567890#lrd=0x0:0x0,1,,," target="_blank" rel="noopener" aria-label="See our Google reviews" style="text-decoration: none;">
    <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
  </a>
</span>
  </div>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let review of reviews">
      <div class="card h-100 shadow-sm" style="min-height: 340px;">
        <div class="card-body d-flex flex-column align-items-center text-center justify-content-between p-3" style="height: 100%;">
          <img [src]="review.avatar" class="rounded-circle mb-3" alt="Avatar" width="70" height="70">
          <h5 class="card-title mb-1">{{ review.name }}</h5>
          <div class="mb-2 text-warning">
            <ng-container *ngFor="let star of [].constructor(review.rating)">&#9733;</ng-container>
            <ng-container *ngFor="let star of [].constructor(5 - review.rating)">&#9734;</ng-container>
          </div>
          <p class="card-text" style="font-size: 1.05rem; margin-top: 1rem; margin-bottom: 0; min-height: 90px; max-height: 170px; overflow-y: auto;">{{ review.text }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="text-center mt-4">
    <a href="https://www.google.com/search?q=abinash+mohanta+business+name&ludocid=1234567890#lrd=0x0:0x0,1,,," target="_blank" rel="noopener" class="google-btn" aria-label="View more reviews on Google">
  <span class="google-text">
    View More Reviews on
    <a href="https://www.google.com/search?q=abinash+mohanta+business+name&ludocid=1234567890#lrd=0x0:0x0,1,,," target="_blank" rel="noopener" aria-label="See our Google reviews" style="text-decoration: none;">
      <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </a>
  </span>
</a>
  </div>
</div>
