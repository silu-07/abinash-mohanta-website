<div class="container py-5">
  <h2 class="text-center mb-5">CONTACT</h2>
  <div class="row justify-content-center align-items-stretch" style="min-height: 420px;">
    <div class="col-12 col-lg-6 d-flex align-items-stretch mb-4 mb-lg-0">
      <div class="p-4 bg-light rounded-2 shadow-sm w-100 d-flex flex-column justify-content-center">
        <h5 class="mb-3" style="letter-spacing: 0.15em; text-transform: uppercase; font-size: 1.1rem; font-weight: 600;">Send a Message</h5>
        <form>
          <div class="mb-3">
            <label for="contactName" class="form-label">Name</label>
            <input type="text" class="form-control" id="contactName" placeholder="Your Name">
          </div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="contactEmail" placeholder="you@email.com">
          </div>
          <div class="mb-3">
            <label for="contactMessage" class="form-label">Message</label>
            <textarea class="form-control" id="contactMessage" rows="5" placeholder="Type your message..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send</button>
        </form>
      </div>
    </div>
    <div class="col-12 col-lg-6 d-flex align-items-stretch">
      <div class="p-4 bg-white rounded-2 shadow-sm w-100 d-flex flex-column justify-content-center">
        <h5 class="mb-3" style="letter-spacing: 0.15em; text-transform: uppercase; font-size: 1.1rem; font-weight: 600;">Contact Info</h5>
        <div class="mb-3">
          <strong>Email:</strong> <a href="mailto:abinash@example.com">abinash.com</a><br>
          <strong>Phone:</strong> <a href="tel:+911234567890">+91 12345 67890</a><br>
          <strong>Address:</strong> Bhubaneswar, Odisha, India
        </div>
        <div style="width: 100%; height: 180px; background: #f1f3f4; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 1rem;">
          [Google Map Placeholder]
        </div>
      </div>
    </div>
  </div>
</div>
