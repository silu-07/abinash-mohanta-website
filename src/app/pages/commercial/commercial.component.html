<div class="container py-5" appInViewport>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let item of commercialImages">
      <div class="card h-100 shadow-sm" style="min-height: 340px;">
        <img [src]="item.image" class="card-img-top" alt="Commercial image" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column align-items-center text-center justify-content-between p-3" style="height: 100%;">
          <h5 class="card-title mb-2">{{ item.title }}</h5>
          <p class="card-text mb-3" style="font-size: 1.05rem; min-height: 80px; max-height: 140px; overflow-y: auto;">{{ item.description }}</p>
          <a [href]="item.link" target="_blank" rel="noopener" class="btn btn-outline-primary mt-auto" style="font-weight: 500;">View Project</a>
        </div>
      </div>
    </div>
  </div>
</div>
