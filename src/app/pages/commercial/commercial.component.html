<div class="container py-5" appInViewport>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let item of images">
      <div class="card h-100 shadow-sm position-relative overflow-hidden commercial-card-custom"
        (click)="goToProject(item)" style="cursor:pointer;">
        <img [src]="item.image" class="commercial-card-img w-100 h-100 position-absolute top-0 start-0"
          alt="Commercial image">
        <div class="card-overlay position-absolute top-0 start-0 w-100 h-100 p-3">
          <div class="flex-grow-1 d-flex flex-column justify-content-end align-items-center text-center">
            <h5 class="card-title mb-2 text-white commercial-card-title">{{ item.title }}</h5>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
