<div class="container py-5" appInViewport>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let item of commercialImages">
      <div class="card h-100 shadow-sm position-relative overflow-hidden" style="min-height: 340px;">
  <img [src]="item.image" class="w-100 h-100 position-absolute top-0 start-0" alt="Commercial image" style="object-fit: cover; min-height: 340px;">
  <div class="card-overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-between p-3" style="background: rgba(0,0,0,0.38); z-index: 2;">
    <div class="d-flex justify-content-end">
      <a [href]="item.link" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm" style="font-weight: 500; z-index:3;">View Project</a>
    </div>
    <div class="flex-grow-1 d-flex flex-column justify-content-end align-items-center text-center">
      <h5 class="card-title mb-2 text-white" style="text-shadow: 0 2px 8px rgba(0,0,0,0.35);">{{ item.title }}</h5>
      <p class="card-text mb-0 text-white" style="font-size: 1.05rem; text-shadow: 0 2px 8px rgba(0,0,0,0.35);">{{ item.description }}</p>
    </div>
  </div>
</div>
    </div>
  </div>
</div>
