<div class="commercial-modal-backdrop" *ngIf="open" (click)="onClose()">
  <div class="commercial-modal" (click)="$event.stopPropagation()">
    <button class="commercial-modal-close" (click)="onClose()" aria-label="Close">&times;</button>
    <div class="commercial-modal-content">
      <div class="commercial-modal-image">
        <img [src]="image" [alt]="title" />
      </div>
      <div class="commercial-modal-info">
        <h2 class="commercial-modal-title">{{ title }}</h2>
        <p class="commercial-modal-description">{{ description }}</p>
      </div>
    </div>
  </div>
</div>
