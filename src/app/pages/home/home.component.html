<app-header></app-header>

<!-- Main Content -->
<div class="home-main">
  <div class="main-image-container">
    <h1 class="photographer-name">ABINASH MOHANTA</h1>
<div class="main-image-row">
  <div class="arrow-container left">
    <button class="arrow left" aria-label="Previous" (click)="prevImage()">
      <svg width="36" height="36" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3L6 9L12 15" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <img
    [src]="currentImage"
    alt="Portrait"
    class="main-image"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd($event)"
    (click)="openImageModal(currentImage)"
    style="cursor: zoom-in;"
  />
  <div class="arrow-container right">
    <button class="arrow right" aria-label="Next" (click)="nextImage()">
      <svg width="36" height="36" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3L12 9L6 15" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
    <app-footer></app-footer>
  </div>
</div>


<!-- Fullscreen Image Modal Overlay -->
<div class="image-modal-overlay" *ngIf="modalOpen">
  <button class="modal-arrow left" (click)="prevImage()" aria-label="Previous image">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </button>
  <img [src]="modalImage" alt="Enlarged" class="modal-image" />
  <button class="modal-arrow right" (click)="nextImage()" aria-label="Next image">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </button>
  <button class="close-modal" (click)="closeImageModal()" aria-label="Close image">&#10005;</button>
</div>

<app-movetotop></app-movetotop>
