<!-- Main Content -->
<div class="home-main">
  <div class="main-image-container">
    <h1 class="photographer-name">ABINASH MOHANTA</h1>
    <div class="main-image-row">

      <!-- Bootstrap Carousel Replacement -->
      <div id="homeBootstrapCarousel" class="carousel slide carousel-container" [ngClass]="{'gallery-open': isGalleryOpen}" data-bs-ride="carousel" data-bs-pause="false">
        <div class="carousel-inner">
          <div *ngFor="let img of images; let i = index" class="carousel-item" [class.active]="i === 0">
            <img [src]="img" class="carousel-image d-block w-100" alt="Carousel image" (click)="openGalleryAt(i)" />
          </div>
        </div>
        <button *ngIf="isGalleryOpen === false" class="carousel-control-prev" type="button" data-bs-target="#homeBootstrapCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button *ngIf="isGalleryOpen === false" class="carousel-control-next" type="button" data-bs-target="#homeBootstrapCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <!-- Hidden LightGallery container -->
      <div #lightGallery style="display: none;">
        <a *ngFor="let img of images" [href]="img">
          <img [src]="img" />
        </a>
      </div>
    </div>
  </div>
</div>
