<!-- Text Section -->
<section class="photography-intro">
    <h2>Daily Photography Portfolio</h2>
    <p>
        Explore a curated selection of my favorite moments, captured across genres and locations.
        From breathtaking landscapes to intimate portraits, each image tells a unique story.
    </p>
</section>


<!-- Photography Grid -->
<div class="photography-grid">
    <div class="grid-item" *ngFor="let photo of photographyImages">
        <img [src]="photo.src" [alt]="photo.alt" class="grid-image" />
        <div class="grid-overlay">
            <h5>{{ photo.title }}</h5>
        </div>
    </div>
</div>

<!-- Place this below your photography grid in home.component.html -->
<div class="photography-view-more">
    <button class="view-more-btn" (click)="onViewMore()">View More</button>
</div>
