<section class="commercial-section">
  <div class="commercial-content">
    <div class="commercial-header-row">
      <div class="commercial-text">
        <h2>Commercial Photography</h2>
        <p>
          Explore a curated selection of my best client work, captured across genres and locations.
          From professional portraits to commercial shoots, each image is crafted to tell a unique story and deliver value to my clients.
        </p>
      </div>

    </div>
    <div class="photography-grid">
      <div class="grid-item" *ngFor="let photo of photographyImages">
        <img [src]="photo.src" [alt]="photo.alt" class="grid-image" />
        <div class="grid-overlay">
          <h5>{{ photo.title }}</h5>
        </div>
      </div>
    </div>
    <div class="photography-view-more">
      <button class="view-more-btn" (click)="onViewMore()">View More</button>
    </div>
  </div>
</section>
