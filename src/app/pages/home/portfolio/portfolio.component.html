<section class="portfolio-section">
  <div class="portfolio-header-row">
    <h2 class="portfolio-heading">My Portfolio</h2>
    <button class="portfolio-more-btn">More</button>
  </div>
  <div class="portfolio-row-wrapper">
  <div class="portfolio-row" #portfolioRow (scroll)="onRowScroll(portfolioRow)">
    <div class="portfolio-card" *ngFor="let card of portfolioCards">
      <img [src]="card.img" [alt]="card.alt" class="portfolio-card-img">
      <div class="portfolio-card-content">
        <h3 class="portfolio-card-title">{{ card.title }}</h3>
        <p class="portfolio-card-desc">{{ card.desc }}</p>
      </div>
    </div>
  </div>
  <button *ngIf="canScrollLeft" class="portfolio-scroll-btn left" (click)="scrollLeft(portfolioRow)" aria-label="Scroll left">
    &#8592;
  </button>
  <button *ngIf="canScrollRight" class="portfolio-scroll-btn right" (click)="scrollRight(portfolioRow)" aria-label="Scroll right">
    &#8594;
  </button>
</div>
</section>
