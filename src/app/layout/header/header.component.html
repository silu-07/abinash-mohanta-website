<div class="home-header" [ngClass]="{'scrolled': isScrolled}" #carouselScroll>
  <div class="logo">
    <img src="/logo/logo.png" alt="Logo" class="logo-image" />
  </div>
  <button class="hamburger" [class.open]="showMobileNav" (click)="showMobileNav = !showMobileNav" [attr.aria-label]="showMobileNav ? 'Close navigation' : 'Open navigation'">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <nav class="main-nav" [class.mobile-open]="showMobileNav">
    <a routerLink="/home" routerLinkActive="active-link" (click)="closeMobileNav()">Home</a>
    <a routerLink="/personal" routerLinkActive="active-link" (click)="closeMobileNav()">Personal</a>
    <a routerLink="/commercial" routerLinkActive="active-link" (click)="closeMobileNav()">Commercial</a>
    <a routerLink="/reviews" routerLinkActive="active-link" (click)="closeMobileNav()">Reviews</a>
    <a routerLink="/contact" routerLinkActive="active-link" (click)="closeMobileNav()">Contact</a>
    <a routerLink="/about" routerLinkActive="active-link" (click)="closeMobileNav()">About</a>
  </nav>
</div>
